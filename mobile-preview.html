<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Chuhong Zhou — Mobile Preview</title>
    <style>
      :root {
        color-scheme: light;
        font-family:
          -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        display: grid;
        min-height: 100dvh;
        padding: 28px;
        place-items: center;
        color: #6f706b;
        background:
          radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.95), transparent 52%),
          #ececE8;
      }

      .preview-stage {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 12px;
      }

      .preview-meta {
        display: flex;
        align-items: center;
        gap: 8px;
        margin: 0;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
      }

      .preview-meta::before {
        width: 6px;
        height: 6px;
        border-radius: 50%;
        background: #9a9b95;
        content: "";
      }

      .phone-frame {
        width: 406px;
        height: 860px;
        padding: 8px;
        border-radius: 46px;
        background: #171714;
        box-shadow:
          0 28px 70px rgba(32, 30, 25, 0.2),
          0 3px 12px rgba(32, 30, 25, 0.12);
      }

      .phone-frame iframe {
        display: block;
        width: 100%;
        height: 100%;
        border: 0;
        border-radius: 38px;
        background: #fff;
      }

      @media (max-width: 480px), (max-height: 920px) {
        body {
          display: block;
          min-height: 100dvh;
          padding: 0;
          background: #fff;
        }

        .preview-meta {
          display: none;
        }

        .phone-frame {
          width: 390px;
          max-width: 100vw;
          height: 844px;
          max-height: 100dvh;
          margin: 0 auto;
          padding: 0;
          border-radius: 0;
          background: transparent;
          box-shadow: none;
        }

        .phone-frame iframe {
          border-radius: 0;
        }
      }
    </style>
  </head>
  <body>
    <main class="preview-stage">
      <p class="preview-meta">Mobile Preview · 390 × 844</p>
      <div class="phone-frame">
        <iframe
          src="./index.html"
          title="Chuhong Zhou portfolio mobile preview"
          loading="eager"
        ></iframe>
      </div>
    </main>
  </body>
</html>
